# SGT cloud runner. Deploy from the repo root: fly deploy -c deploy/fly/fly.toml
app = "sgt-runner"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SGT_SECRET_STORE_DIR = "/data/sgt/secrets"   # rotating Schwab login (red-team F-1); 0700, sgt-owned
  SGT_MAX_ORDER_NOTIONAL = "75000"

[[mounts]]
  source = "sgt_data"
  destination = "/data"
  initial_size = "5gb"
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# Fade Tape page (owner decision 2026-11-05, option A): sgt.ops.chartserver serves ONE read-only file at a secret
# path. The machine must never be stopped by the proxy: cron and the fade listener run on it.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 25
