[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgt"
version = "0.1.0"
description = "Statistical-Grounded Trader: social + market data pipeline with point-in-time features and walk-forward backtesting"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "requests>=2.31",
    "praw>=7.7",
    "yfinance>=0.2.40",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# Heavy ML deps kept out of the base install. `pip install .[ml]` to enable FinBERT.
ml = [
    "torch>=2.2",
    "transformers>=4.38",
]
dev = [
    "pytest>=8.0",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
