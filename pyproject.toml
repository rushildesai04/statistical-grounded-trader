[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgt"
version = "0.1.0"
description = "Statistical-Grounded Trader: social + market data pipeline with point-in-time features and walk-forward backtesting"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "requests>=2.31",
    "praw>=7.7",
    "yfinance>=0.2.40",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # --- intraday track (pinned to tested major versions) ---
    "pyarrow>=26.0,<27",
    "duckdb>=1.5,<2",
    "lightgbm>=4.7,<5",
    "pyyaml>=6.0,<7",
    "exchange_calendars>=4.13,<5",
    "httpx>=0.28,<0.29",
    "keyring>=25,<26",
]

[project.optional-dependencies]
# Telegram collector (user-session, read-only). `pip install .[crowd]`.
crowd = [
    "telethon>=1.45,<2",
]
# Interactive Brokers adapter (local IB Gateway / TWS). `pip install .[ibkr]`.
# Imported lazily by sgt.brokers.ibkr; the base install and test-suite never require it.
ibkr = [
    "ib_async>=2.1,<3",
]
# Heavy ML deps kept out of the base install. `pip install .[ml]` to enable FinBERT.
ml = [
    "torch>=2.2",
    "transformers>=4.38",
]
dev = [
    "pytest>=8.0",
    "psycopg2-binary>=2.9",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23,<0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
